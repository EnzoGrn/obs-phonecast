name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; nothing in CI needs to write to the repo.
permissions:
  contents: read

jobs:
  test:
    # The matrix covers all three OSes because src/obs/platform.js returns a
    # DIFFERENT descriptor depending on the platform, and the tests verify
    # that. Testing only on Linux would let a Windows or macOS regression
    # slip through.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: --help must work with no dependencies installed
        # Regression already hit once: importing the orchestrator at module
        # load time breaks --help on a freshly cloned repo.
        shell: bash
        run: |
          rm -rf node_modules
          node src/index.js --help > /dev/null

  binary:
    # Catches what the Node test matrix cannot: a compiled binary that
    # cannot start, or whose dock serves nothing because web/index.html was
    # not embedded (it already shipped broken once).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: npm ci

      - name: Compile (Linux)
        run: |
          node scripts/embed-dock.js
          mkdir -p dist
          bun build --compile ./src/index.js --outfile dist/obs-phonecast

      - name: Binary smoke test (--help, then --dock)
        shell: bash
        run: |
          # Run a COPY from outside the checkout, so nothing can be served
          # from web/ on disk: the page has to come from inside the binary.
          bin="$RUNNER_TEMP/obs-phonecast"
          cp dist/obs-phonecast "$bin"
          cd "$RUNNER_TEMP"

          ./obs-phonecast --help > /dev/null

          ./obs-phonecast --dock --no-open --dock-port 7499 > dock.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:7499/ -o page.html 2>/dev/null; then break; fi
            sleep 0.5
          done
          grep -q '<title>obs-phonecast' page.html || { cat dock.log; echo "dock page not served"; exit 1; }
